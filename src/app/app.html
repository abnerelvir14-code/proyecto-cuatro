<div class="container my-4">
  <h2 id="main-title">Proyecto 4 - Angular Advanced</h2>

  <!-- Sección de NgRx / Tracking Tags (Requisito 7) -->
  <div class="card p-3 my-3 bg-light">
    <h4>Contador de Tracking Tags (Redux)</h4>
    <div id="tracking-container">
      <div *ngFor="let item of (counts$ | async) | keyvalue" class="badge bg-primary fs-6 m-1">
        Tag [{{ item.key }}]: {{ item.value }} clicks
      </div>
    </div>
  </div>

  <div class="row">
    <!-- Componente de Mapbox (Requisito 2) -->
    <div class="col-md-6">
      <div class="card p-3">
        <h4>Mapa Mapbox</h4>
        <div
          class="mapbox-placeholder"
          data-map-style="mapbox://styles/mapbox/streets-v11"
          data-zoom="12"
          data-center="-87.2063,14.0818"
          [attr.data-access-token]="mapboxAccessToken"
          style="height: 300px; width: 100%; position: relative;">
          <button
            id="map-marker"
            type="button"
            (click)="onMarkerClick()"
            appClickTracker="marker-mapa"
            aria-label="Marker del mapa"
            style="background-color: red; border: 0; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; position: absolute; left: 50%; top: 50%;">
          </button>

          <div *ngIf="showPopup" id="marker-popover">¡Marker clickeado con éxito!</div>
        </div>
      </div>
    </div>

    <!-- Componente con Animaciones -->
    <div class="col-md-6">
      <div class="card p-3" aria-label="Caja animada">
        <h4>Animaciones</h4>
        <p class="mb-0">Contenido animado</p>
      </div>
      
      <button 
        id="btn-extra" 
        class="btn btn-secondary w-100 mt-2" 
        appClickTracker="btn-secundario">
        Boton Secundario para Tracking
      </button>
    </div>
  </div>
</div>
